dependencies {
    // Note: use of bundles...
    implementation libs.bundles.core.dependencies

    testImplementation libs.bundles.unit.testing
    testRuntimeOnly libs.bundles.test.runtime.only
    constraints {
        // jobj-contract-verifier 5.2, its last release, brings randomizer 10.2 and with it jobj-copy 4.2, whose
        // jackson-databind is 2.16.0-rc1: a release candidate, and the 15 Dependabot alerts of this repository.
        // jobj-copy 4.3 takes jackson 2.22.4
        testImplementation(libs.jobj.copy)
    }
}

// zip4j-extension, a test dependency, depends on an older file-worker. Gradle resolves those
// coordinates to this project itself, which put the project's own jar on the test runtime class path:
// a copy of build/classes/java/main, which comes first, and without a task dependency on :jar, so
// test needed mustRunAfter(jar) to pass Gradle's validation, and pitest, which takes that class path
// too, needs it as well (#99; the same as astrapi69/silly-io#54)
configurations.named("testRuntimeClasspath") {
    exclude group: project.group as String, module: project.name
}
