pitest {
    junit5PluginVersion = libs.versions.pitest.junit5.plugin.version.get()
    pitestVersion = libs.versions.pitest.version.get()
    // junit-platform-launcher is declared in testRuntimeOnly (gradle/libs.versions.toml, bundle
    // test-runtime-only). Left on, the plugin resolves a detached copy of testImplementation to find
    // the JUnit Platform version. That copy has neither the constraints of gradle/dependencies.gradle
    // nor the exclusion on testRuntimeClasspath, and the dependency submission reports what it
    // resolves: jobj-copy 4.2 with jackson-databind 2.16.0-rc1, and file-worker 11.3 with
    // commons-io 2.11.0, commons-lang3 3.12.0 and commons-beanutils 1.9.4 (#103)
    addJUnitPlatformLauncher = false
    // To measure a few classes, name them in targetClasses and keep targetTests at
    // ["io.github.astrapi69.file.*"] (or pass --targetTests): without targetTests the plugin takes
    // targetClasses for the tests, runs none, and reports every mutant as NO_COVERAGE.
    targetClasses = ["io.github.astrapi69.file.*"]
    // MergeWithTemplateMainTest calls main, and a mutant that turns its arguments into a usage error
    // makes main call System.exit, which ends the minion. The usage error itself is tested through
    // commandLine in MergeWithTemplateUsageTest, which PIT runs (#99).
    excludedTestClasses = ["io.github.astrapi69.file.tools.MergeWithTemplateMainTest"]
    threads = 4
    // The minions take java.io.tmpdir below build/ as the test task does: a mutant that makes a test
    // fail before its cleanup leaves its files there, not in the system's temporary directory (#119)
    jvmArgs = ["-Djava.io.tmpdir=" + layout.buildDirectory.dir("tmp/pitest-minions").get().asFile.absolutePath]
    outputFormats = ["HTML", "XML"]
    timestampedReports = false
}

tasks.named("pitest") {
    doFirst {
        layout.buildDirectory.dir("tmp/pitest-minions").get().asFile.mkdirs()
    }
}
