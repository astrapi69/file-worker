test {
    useJUnitPlatform()
    // java.io.tmpdir of the test JVM is this task's temporary directory below build/. What the
    // methods that use the temporary directory by design create (DirectoryFactory.newTempDirectory,
    // the concatenate overloads of ModifyFileExtensions without a result file), and what a test
    // leaves there when it fails before its cleanup, goes with ./gradlew clean instead of piling up
    // in the system's temporary directory (#119)
    systemProperty "java.io.tmpdir", temporaryDir.absolutePath
}


jacocoTestReport {
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

check.dependsOn jacocoTestReport

// The coverage floor: the build fails when the whole library falls below 98% of the lines or 93% of
// the branches. Set at 90% and 85% in #38, when the tests reached 95.7% and 89.6%; raised to what they
// reach after the mutation testing of #99, 2162 of 2188 lines (98.8%) and 937 of 1002 branches (93.5%)
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.98
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.93
            }
        }
    }
}
jacocoTestCoverageVerification.dependsOn test
check.dependsOn jacocoTestCoverageVerification
